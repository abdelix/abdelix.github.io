name: Sync publications and patents

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday at 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Regenerate bibliographies 📚
        env:
          # Optional: without these repository secrets the EPO patent search is skipped.
          EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}
          EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
        run: python3 bin/sync_orcid.py
      - name: Commit changes and redeploy 🚀
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _bibliography; then
            echo "Bibliographies are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _bibliography
          git commit -m "chore(publications): sync bibliographies from ORCID" \
            -m "Automated update generated by bin/sync_orcid.py."
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref "${{ github.ref_name }}"
